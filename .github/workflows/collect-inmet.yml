name: Coleta diaria INMET

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data da coleta (AAAA-MM-DD); vazio usa ontem em Brasilia"
        required: false
        type: string
      max_stations:
        description: "Limite para teste; zero coleta todas as estacoes"
        required: true
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: inmet-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia
        run: python -m pip install "requests>=2.31,<3"

      - name: Coletar observacoes do INMET
        env:
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
          MAX_STATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_stations || '0' }}
        run: |
          args=(--max-stations "$MAX_STATIONS")
          if [[ -n "$TARGET_DATE" ]]; then
            args+=(--date "$TARGET_DATE")
          fi
          python scripts/collect_inmet_daily.py "${args[@]}"

      - name: Publicar particao e manifesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inmet
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de dados para publicar."
            exit 0
          fi
          git commit -m "data: coleta INMET $(date -u +%F)"
          git push
