name: Coleta diaria INMET

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Data UTC da coleta (AAAA-MM-DD); vazio usa ontem"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: inmet-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia
        run: python -m pip install "requests>=2.31,<3"

      - name: Coletar observacoes do INMET WIS2
        env:
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          args=()
          if [[ -n "$TARGET_DATE" ]]; then
            args+=(--date "$TARGET_DATE")
          fi
          python scripts/collect_inmet_daily.py "${args[@]}"

      - name: Publicar particao e manifesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inmet
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de dados para publicar."
            exit 0
          fi
          git commit -m "data: coleta INMET WIS2 $(date -u +%F)"
          git push
